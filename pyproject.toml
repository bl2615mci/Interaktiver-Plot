[project]
name = "Interaktiver_Plot"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Lukas Behensky", email = "bl9375@mci4me.at"},
]
dependencies = ["pandas>=3.0.3", "numpy>=2.4.6", "matplotlib>=3.10.9", "streamlit>=1.57.0", "plotly>=6.7.0"]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true
